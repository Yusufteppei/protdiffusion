[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protdiffusion"
version = "0.1.0"
description = "A minimal implementation of RFDiffusion in PyTorch."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Zaid Yusuf" }
]

dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "numpy>=2.3",
    "matplotlib>=3.10",
    "tqdm>=4.67",
    "einops>=0.8",
    "biopython>=1.85",
]
